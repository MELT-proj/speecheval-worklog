<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SpeechEval Worklog</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="/login">
    <div class="brand">
      <div class="mark" aria-hidden="true">SE</div>
      <div>
        <h1>SpeechEval <span>worklog</span></h1>
        <p class="tagline">Sign in to see the results</p>
      </div>
    </div>
    <p id="login-error" class="login-error" hidden></p>
    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" autofocus required>
    <input id="login-next" name="next" type="hidden" value="/">
    <button class="btn" type="submit">Sign in</button>
  </form>
  <script src="/static/util.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
