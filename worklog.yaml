# SpeechEval worklog. Read-only: the only write is the SQLite cache.
# Drop inspect logs under a campaign folder in `roots` and the page picks them up.

roots:
  - /mnt/scratch-artemis/giuseppe/melt-data/eval-runs
include: ["speechval-*"]        # campaign folder globs; "*" for everything
ignore: ["**/smoke-limit*/**", "**/smoke/**", "**/packs/**"]
cache: /mnt/scratch-artemis/giuseppe/worklog/worklog.sqlite
port: 8765
host: 127.0.0.1                 # --host 0.0.0.0 when the link is shared
interval_seconds: 30
aggregate: macro                # macro | weighted

# Matrix columns, in display order. A slice matches a family by benchmark and,
# when given, direction (derived from its source/target languages).
# columns: a slice's benchmark id must be listed under `benchmarks` (the
# validation column) or `test_benchmarks` (the test page's same column). A
# `benchmarks` entry means validation; a `test_benchmarks` entry means test;
# an id in both is a config error, and an id in neither is unclassified.
families:
  - {name: LibriSpeech, task: asr, benchmarks: [librispeech-validation-clean, librispeech-validation-other],
     test_benchmarks: [librispeech-test-clean, librispeech-test-other]}
  - {name: VoxPopuli, task: asr, benchmarks: [voxpopuli-dev], test_benchmarks: [voxpopuli-test]}
  - {name: FLEURS XtoEN, task: st, direction: xen, benchmarks: [fleurs24-st-xen-dev],
     test_benchmarks: [fleurs24-st-xen-test]}
  - {name: FLEURS ENtoX, task: st, direction: enx, benchmarks: [fleurs24-st-enx-dev],
     test_benchmarks: [fleurs24-st-enx-test]}
  - {name: CoVoST2 XtoEN, task: st, direction: xen, benchmarks: [covost2-dev],
     test_benchmarks: [covost2-test]}
  - {name: CoVoST2 ENtoX, task: st, direction: enx, benchmarks: [covost2-enx-dev],
     test_benchmarks: [covost2-enx-test]}
  - {name: Europarl XtoEN, task: st, direction: xen, benchmarks: [europarl-st-dev],
     test_benchmarks: [europarl-st-test]}
  - {name: Europarl ENtoX, task: st, direction: enx, benchmarks: [europarl-st-dev],
     test_benchmarks: [europarl-st-test]}
  # Pairs with no English side (de->es, fr->it, ...), which match neither family
  # above: a slice takes the first family that matches, and this one has no
  # direction, so it catches only the leftovers. Qwen3-Omni is the only row
  # that runs them; the en-only baselines skip them.
  - {name: Europarl other pairs, task: st, benchmarks: [europarl-st-dev], test_benchmarks: [europarl-st-test]}
  - {name: PolySpeech, task: audio_mcq, benchmarks: [polyspeech-100-pa_qt-200]}

# Test-side benchmarks that have no validation column at all: they appear in
# the test page's feed and inspector, never in the matrix and never on Results.
# Ids are the `speechval-test` suite's benchmark names (melt-eval
# configs/eval/suites/speechval-test.yaml).
test_benchmarks:
  - mls-test
  - fleurs24-asr-test
  - mcif-chunked-asr
  - mcif-chunked-st
  - mcif-sfp
  - air-bench-chat-speech

metrics:
  corpus_wer_raw: {label: WER, lower: true}
  corpus_wer_extracted: {label: WER (extracted), lower: true}
  corpus_cer_raw: {label: CER, lower: true}
  corpus_bleu: {label: BLEU, lower: false}
  corpus_chrf: {label: chrF, lower: false}
  corpus_spbleu: {label: spBLEU, lower: false}
  metricx: {label: MetricX, lower: true}
  comet: {label: COMET, lower: false}
  choice_accuracy: {label: Accuracy, lower: false}
  unresolved_rate: {label: Unresolved, lower: true}

headline:
  asr: corpus_wer_raw
  st: corpus_bleu
  audio_mcq: choice_accuracy

# Trend lines: several model-name prefixes can share one label and identity.
# Identity is by model name, so renaming campaign folders never moves a line.
trends:
  default_metrics:
    st: metricx
  lineages:
    - {id: melt/fondue, name: MELT/Fondue, match: "^fondue"}
    - {id: smurf/16n, name: "SMURF · 16n", match: "^eurollm-speech-16n"}
    - {id: smurf/batch, name: "SMURF · batch", match: '^step-\d+$'}
